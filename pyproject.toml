[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "schema-documenter"
dynamic = ["version"]
description = "Generate an ERD and a schema reference (HTML or PDF) from selected database tables."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "SQLAlchemy>=2.0,<3",
    "reportlab>=4.0",
    # database drivers, all bundled into the executable
    "psycopg[binary]>=3.1",   # PostgreSQL
    "PyMySQL>=1.1",           # MySQL / MariaDB
    "pymssql>=2.3",           # SQL Server
]

[project.optional-dependencies]
dev = ["pyinstaller>=6.6", "pytest>=8", "pypdf>=4"]

[project.scripts]
schemadoc = "schemadoc.cli:main"

[project.gui-scripts]
schema-documenter = "schemadoc.gui:main"

[tool.setuptools.dynamic]
version = { attr = "schemadoc.__version__" }  # set in src/schemadoc/__init__.py

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
